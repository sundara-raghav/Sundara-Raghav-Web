name: Deploy to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Validate Netlify credentials
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "NETLIFY_AUTH_TOKEN is not set in GitHub Actions secrets."
            exit 1
          fi

          if [[ -z "$NETLIFY_SITE_ID" ]]; then
            echo "NETLIFY_SITE_ID is not set in GitHub Actions secrets."
            exit 1
          fi

          # Confirm token can access the site before attempting deploy.
          npx netlify-cli api getSite --data '{"site_id":"'"$NETLIFY_SITE_ID"'"}' --auth "$NETLIFY_AUTH_TOKEN" > /dev/null
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=dist --prod --message "$DEPLOY_MESSAGE" --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: "GitHub Actions deploy #${{ github.run_number }}"
